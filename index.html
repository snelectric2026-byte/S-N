<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الهاتف</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/530/fabric.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Tahoma, sans-serif;
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: #1f1f1f;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            z-index: 100;
        }
        .main-layout {
            display: flex;
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        /* تصميم القائمة الجانبية لتظهر على الجوال بشكل صحيح */
        #sidebar {
            width: 240px;
            background: #1a1a1a;
            border-left: 1px solid #333;
            position: absolute;
            right: -240px; /* مخفية افتراضياً خارج الشاشة من اليمين */
            top: 0;
            bottom: 0;
            transition: right 0.3s ease-in-out;
            z-index: 99;
            padding: 15px;
            box-shadow: -5px 0px 15px rgba(0,0,0,0.5);
        }
        /* كلاس يتم إضافته بالجافاسكريبت لإظهار القائمة */
        #sidebar.active {
            right: 0; 
        }
        #canvas-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1e1e1e;
        }
        .btn {
            background: #007bff;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <button class="btn" id="sidebarToggle">☰ القائمة</button>
        <h3>التصميم الهندسي</h3>
    </header>

    <div class="main-layout">
        <!-- القائمة الجانبية -->
        <div id="sidebar">
            <h4>لوحة التحكم</h4>
            <p>أدوات الرسم والتعديل</p>
            <button class="btn" style="width:100%; margin-top:10px;">إضافة عنصر</button>
        </div>

        <!-- منطقة العمل -->
        <div id="canvas-container">
            <canvas id="c" width="300" height="400"></canvas>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
