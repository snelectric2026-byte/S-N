<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>S⚡N Electric MEP Engine v3.5 - المولد المعماري والمحاكاة الذكية</title>

    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-topbar: rgba(15, 23, 42, 0.85);
            --text-topbar: #ffffff;
            --btn-bg: rgba(255, 255, 255, 0.1);
            --btn-text: #ffffff;
            --bg-sidebar: rgba(15, 23, 42, 0.95);
        }

        body.theme-light {
            --bg-topbar: #ffffff;
            --text-topbar: #000000;
            --btn-bg: #2563eb;
            --btn-text: #ffffff;
            --bg-sidebar: #ffffff;
        }

        body.theme-dark {
            --bg-topbar: #000000;
            --text-topbar: #ffffff;
            --btn-bg: #ffffff;
            --btn-text: #000000;
            --bg-sidebar: #0a0a0a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background: #0b0f19; color: #ffffff; overflow: hidden; }

        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #1e2530 0%, #090b0e 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 999999;
            transition: opacity 3.0s ease, visibility 3.0s ease;
            font-family: 'Montserrat', sans-serif;
            direction: ltr;
        }

        .glass-card {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 340px; padding: 35px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            position: relative; overflow: hidden;
        }

        .svg-container { width: 260px; height: 130px; overflow: visible; }
        .svg-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 110px; }

        /* تلوين الحرف بنفس لونه الصافي دون أي ظلال خارجية معارضة */
        .part-s { fill: #ff3344; opacity: 0; transform-origin: 50px 70px; animation: pulseIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 0.3s; }
        .part-bolt { fill: #f5b813; opacity: 0; transform-origin: 130px 65px; animation: pulseIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 1.2s; }
        .part-n { fill: #0088ff; opacity: 0; transform-origin: 200px 70px; animation: pulseIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; animation-delay: 2.1s; }

        @keyframes pulseIn {
            0% { opacity: 0; transform: scale(0.1); }
            60% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 1; transform: scale(1); }
        }

        .text-section { display: flex; flex-direction: column; align-items: center; margin-top: 8px; width: 100%; }
        .brand-title { font-size: 26px; font-weight: 900; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        
        .sn-part { display: flex; gap: 4px; opacity: 0; animation: fadeInCustom 0.8s ease-out forwards; animation-delay: 3.0s; }
        .sn-part .s-letter { color: #ff3344; }
        .sn-part .n-letter { color: #0088ff; }

        .electric-part span {
            display: inline-block; opacity: 0; transform-origin: center;
            animation: letterPulse 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #ffffff;
        }

        .electric-part span:nth-child(1) { animation-delay: 3.3s; }
        .electric-part span:nth-child(2) { animation-delay: 3.4s; }
        .electric-part span:nth-child(3) { animation-delay: 3.5s; }
        .electric-part span:nth-child(4) { animation-delay: 3.6s; }
        .electric-part span:nth-child(5) { animation-delay: 3.7s; }
        .electric-part span:nth-child(6) { animation-delay: 3.8s; }
        .electric-part span:nth-child(7) { animation-delay: 3.9s; }
        .electric-part span:nth-child(8) { animation-delay: 4.0s; }

        @keyframes letterPulse {
            0% { opacity: 0; transform: scale(0.2); }
            70% { opacity: 1; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .line-divider { width: 90%; height: 2px; background: linear-gradient(90deg, transparent, #f5b813, transparent); margin: 10px 0; opacity: 0; animation: fadeInCustom 0.6s ease-out forwards; animation-delay: 4.5s; }
        .tagline { font-size: 11px; font-weight: 800; color: #f5b813; letter-spacing: 4px; opacity: 0; animation: fadeInCustom 0.6s ease-out forwards; animation-delay: 5.0s; }
        
        @keyframes fadeInCustom { to { opacity: 1; } }
        .splash-hidden { opacity: 0; visibility: hidden; pointer-events: none; }

        /* الشريط الجانبي وتأثير السحب والانزلاق */
        .sidebar {
            position: fixed; right: 0; top: 52px; width: 280px; height: calc(100vh - 100px);
            background: var(--bg-sidebar); z-index: 2000;
            box-shadow: -5px 0 25px rgba(0,0,0,0.5);
            transition: transform 0.3s ease-in-out;
            transform: translateX(0);
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        .sidebar.collapsed {
            transform: translateX(100%);
        }

        .glass-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
            transition: all 0.2s;
        }
        .glass-btn:hover { background: rgba(0,242,254,0.2); border-color: #00f2fe; }

        .bottom-console-grid {
            position: fixed; bottom: 0; left: 0; right: 0; height: 48px;
            background: rgba(10, 15, 26, 0.95);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 1000; display: grid; grid-template-columns: repeat(7, 1fr);
            gap: 4px; padding: 3px 6px; font-family: 'Cairo', sans-serif;
        }
        .console-box {
            background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px; display: flex; flex-direction: column; justify-content: center;
            align-items: center; padding: 2px 4px; cursor: pointer; user-select: none;
        }
        .console-box .box-title { font-size: 9px; color: #94a3b8; margin-bottom: 1px; }
        .console-box .box-value { font-size: 11px; font-weight: bold; color: #00f2fe; }
        .console-box.active-snap { background: rgba(34, 197, 94, 0.15); border-color: #22c55e; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

    <!-- الشاشة الافتتاحية -->
    <div id="splash-screen">
        <div class="glass-card">
            <svg class="svg-container" viewBox="0 0 260 130">
                <text x="15" y="100" class="svg-text part-s">S</text>
                <polygon class="part-bolt" points="135,10 95,70 128,70 102,120 155,52 122,52"/>
                <text x="150" y="100" class="svg-text part-n">N</text>
            </svg>
            <div class="text-section">
                <div class="brand-title">
                    <div class="sn-part">
                        <span class="s-letter">S</span><span class="n-letter">N</span>
                    </div>
                    <span class="electric-part">
                        <span>E</span><span>L</span><span>E</span><span>C</span><span>T</span><span>R</span><span>I</span><span>C</span>
                    </span>
                </div>
                <div class="line-divider"></div>
                <div class="tagline">POWERED BY PRECISION</div>
            </div>
        </div>
    </div>

    <!-- الشريط العلوي -->
    <header class="top-bar" style="background: var(--bg-topbar); color: var(--text-topbar); position: relative; z-index: 1500; display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; height: 52px;">
        <div class="brand" style="display: flex; align-items: center; gap: 8px;">
            <button type="button" id="sidebarToggleBtn" class="glass-btn" style="padding: 4px 10px; font-size: 16px;">☰</button>
            <span class="logo-sn" style="color: #ff3344; font-weight:900;">S</span><span class="logo-bolt">⚡</span><span class="logo-sn" style="color: #0088ff; font-weight:900;">N</span>
            <span style="font-size:12px; color:#f5b813; font-weight: bold;">MEP v3.5</span>
        </div>

        <div class="top-actions" style="display: flex; gap: 6px;">
            <button type="button" id="btnView3D" class="glass-btn">🧊 3D</button>
            <button type="button" id="btnView2D" class="glass-btn active">📐 2D</button>
            <button type="button" id="btnSave" class="glass-btn">🖼️ صورة</button>
            <button type="button" id="btnUndo" class="glass-btn">↩️ تراجع</button>
            <button type="button" id="btnRedo" class="glass-btn">↪️ اللاحق</button>
        </div>
    </header>

    <div class="app-layout" style="display: flex; height: calc(100vh - 100px);">
        <main class="canvas-container-wrapper" style="position: relative; flex: 1; height: 100%; overflow: hidden;">
            <div id="canvas2DContainer" style="width: 100%; height: 100%; position: absolute; top:0; left:0;">
                <canvas id="mepCanvas"></canvas>
            </div>
        </main>

        <!-- الشريط الجانبي -->
        <aside class="sidebar" id="sidebarMenu">
            <div class="sidebar-header" style="padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <span style="font-weight: bold; color: #00f2fe; font-size: 13px;">قائمة العناصر والأدوات</span>
                <button type="button" id="sidebarCloseBtn" style="background: none; border: none; color: #fff; font-size: 16px; cursor: pointer;">✕</button>
            </div>
            <div class="sidebar-scroll-content" style="padding: 15px; overflow-y: auto; height: calc(100% - 50px);">
                <div class="category-item" style="margin-bottom: 10px;">
                    <button type="button" class="category-title-btn" data-target="electricSec" style="width: 100%; padding: 8px 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 6px; cursor: pointer; text-align: right; font-size: 12px;">💡 كهرباء ▾</button>
                    <div class="popup-window" id="electricSec" style="display: none; padding: 5px 0; flex-direction: column; gap: 5px; margin-top: 5px;">
                        <button type="button" class="symbol-btn" data-type="electrical" data-subtype="مفتاح إنارة" style="padding: 6px; background: #1e293b; color:#fff; border:none; border-radius:4px; cursor:pointer; text-align:right; font-size: 11px;">🔘 مفتاح إنارة</button>
                        <button type="button" class="symbol-btn" data-type="electrical" data-subtype="بريزة" style="padding: 6px; background: #1e293b; color:#fff; border:none; border-radius:4px; cursor:pointer; text-align:right; font-size: 11px;">🔌 بريزة كهرباء</button>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <!-- الشريط السفلي التفاعلي -->
    <div class="bottom-console-grid">
        <div class="console-box active-snap" id="boxSnapToggle">
            <span class="box-title">🧲 الانجذاب</span>
            <span class="box-value" id="valSnapStatus">مفعل 🟢</span>
        </div>
        <div class="console-box">
            <span class="box-title">📍 الإحداثيات (X, Y)</span>
            <span class="box-value">X:<span id="statX">0</span> Y:<span id="statY">0</span></span>
        </div>
        <div class="console-box">
            <span class="box-title">📏 العرض المحدد</span>
            <span class="box-value"><span id="statW">0</span> mm</span>
        </div>
        <div class="console-box">
            <span class="box-title">📐 الطول المحدد</span>
            <span class="box-value"><span id="statH">0</span> mm</span>
        </div>
        <div class="console-box">
            <span class="box-title">⚡ الحمل الكهربائي</span>
            <span class="box-value" id="total-load-text" style="color: #f5b813;">0.0 A</span>
        </div>
        <div class="console-box">
            <span class="box-title">🚰 ضغط السباكة</span>
            <span class="box-value" id="total-pressure-text" style="color: #38bdf8;">0.0 Bar</span>
        </div>
        <div class="console-box">
            <span class="box-title">🖥️ حالة النظام</span>
            <span class="box-value" id="sys-status-text" style="color: #22c55e;">جاهز 🟢</span>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('splash-hidden');
                    setTimeout(() => splash.remove(), 3000);
                }
            }, 7000);
        });
    </script>

    <script src="mep_engine.js"></script>
    <script src="script.js"></script>
</body>
</html>
